# Generated by release_pipeline.py. Change the shared generator, then regenerate.
name: Release candidate builds
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already frozen in source (X.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
env:
  CMAKE_BUILD_TYPE: Release
  PYTHONUTF8: '1'
jobs:
  validate:
    name: Validate frozen source
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate version, pins, and launch names
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: python3 .release/release_package_gate.py --source . --version "$RELEASE_VERSION" --preflight --output "$RUNNER_TEMP/source-gate.json"
  build:
    name: ${{ matrix.artifact }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          artifact: linux-x64
          shell: bash
          container: ubuntu:20.04@sha256:c664f8f86ed5a386b0a340d981b8f81714e21a8b9c73f658c4bea56aa179d54a
        - os: windows-2022
          artifact: windows-x64
          shell: msys2 {0}
        - os: macos-15
          artifact: macos-arm64
          shell: bash
          deployment_target: '11.0'
        - os: macos-15-intel
          artifact: macos-x64
          shell: bash
          deployment_target: '11.0'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}
    steps:
    - name: Bootstrap portable Linux container
      if: matrix.artifact == 'linux-x64'
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl git libstdc++6 python3 python3-pip unzip
        python3 -m pip install --no-cache-dir \
          'cmake==3.30.9' 'tomli==2.2.1'

        # Focal does not package glslc. Use two exact LunarG Focal SDK
        # packages. Their declared glibc floor is 2.29.
        curl -fsSLo /tmp/shaderc.deb \
          https://packages.lunarg.com/vulkan/1.3.283/pool/main/s/shaderc/shaderc_2024.1~rc1-1lunarg20.04-1_amd64.deb
        curl -fsSLo /tmp/vulkan-headers.deb \
          https://packages.lunarg.com/vulkan/1.3.283/pool/main/v/vulkan-headers/vulkan-headers_1.3.283.0~rc1-1lunarg20.04-1_all.deb
        printf '%s  %s\n' \
          '2e78ad32359737d3654dd49c412f6ff16d4da0c5b2dfc80485aacb0d8d6f70e3' /tmp/shaderc.deb \
          '1a55db9d5c356580d77331f63359b351e600e05fff2ca63d6835b4d7809c66b1' /tmp/vulkan-headers.deb \
          | sha256sum -c -
        dpkg -i /tmp/shaderc.deb /tmp/vulkan-headers.deb
    - name: Preserve committed checkout bytes
      shell: bash
      run: |
        git config --global core.autocrlf false
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: '1'
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Trust checked-out CI sources
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        for source in . psxrecomp recomp-ui psxrecomp/lib/recomp-net psxrecomp/lib/retcomm-rbengine; do
          root="$(cd "${GITHUB_WORKSPACE}/${source}" && pwd -P)"
          git config --global --add safe.directory "${root}"
        done
    - name: Record framework revisions
      shell: bash
      run: bash psxrecomp/tools/ci/record_pins.sh
    - name: Lint boot-EXE name consistency
      shell: bash
      run: bash psxrecomp/tools/ci/check_boot_exe.sh .
    - name: Setup host mode (no game C / BIOS backends in CI)
      shell: bash
      run: bash psxrecomp/tools/ci/clear_generated.sh
    - name: Setup MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: 'true'
        install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-SDL2 mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-vulkan-headers mingw-w64-x86_64-shaderc curl zip
    - name: Install deps (Linux)
      if: runner.os == 'Linux'
      run: |
        export DEBIAN_FRONTEND=noninteractive
        export TZ=Etc/UTC
        SUDO=''
        if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
        ${SUDO} apt-get update
        # X11 + xtst required when FetchContent builds SDL3 (XTEST).
        ${SUDO} apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config \
          libsdl2-dev libgl1-mesa-dev libxtst-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
          libasound2-dev libpulse-dev libudev-dev zip \
          libvulkan-dev binutils ccache
        if ! command -v glslc >/dev/null 2>&1; then
          ${SUDO} apt-get install -y --no-install-recommends glslc
        fi
    - name: Install deps (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        brew install cmake ninja pkg-config vulkan-headers shaderc molten-vk
    - name: Verify Vulkan build tools
      run: |
        set -euo pipefail
        command -v glslc
        glslc --version || true
        HDR=""
        for candidate in \
            /mingw64/include/vulkan/vulkan.h \
            /usr/include/vulkan/vulkan.h \
            /opt/homebrew/include/vulkan/vulkan.h \
            /usr/local/include/vulkan/vulkan.h; do
          if [[ -f "${candidate}" ]]; then
            HDR="${candidate}"
            break
          fi
        done
        if [[ -z "${HDR}" ]] && command -v brew >/dev/null 2>&1; then
          BREW_HDR="$(brew --prefix)/include/vulkan/vulkan.h"
          if [[ -f "${BREW_HDR}" ]]; then
            HDR="${BREW_HDR}"
          fi
        fi
        if [[ -z "${HDR}" ]]; then
          echo "::error::vulkan/vulkan.h not found"
          exit 1
        fi
        echo "Found ${HDR}"
    - name: Cache SDL3 source
      uses: actions/cache@v4
      with:
        path: .cache/sdl3-src
        key: sdl3-3.4.10-src-12b34280415ec8418-v1
    - name: Prefetch SDL3 source
      shell: bash
      run: "set -euo pipefail\n# Use repo-relative paths for tar: Windows GITHUB_WORKSPACE is D:\\\u2026\n# and GNU tar treats\
        \ drive-letter abs paths as remote hosts\n# (\"Cannot connect to D\"). Use the pinned inline recipe on every platform.\n\
        OUT=\".cache/sdl3-src\"\nsdl3_env() {\n  local abs=\"${OUT}\"\n  if command -v cygpath >/dev/null 2>&1; then\n   \
        \ abs=\"$(cygpath -m \"${OUT}\")\"\n  elif [[ -d \"${OUT}\" ]]; then\n    abs=\"$(cd \"${OUT}\" && pwd)\"\n  fi\n\
        \  echo \"PSX_SDL3_SOURCE_DIR=${abs}\" >>\"$GITHUB_ENV\"\n  echo \"SDL3 source ready: ${abs}\"\n}\nif [[ -f \"${OUT}/CMakeLists.txt\"\
        \ ]]; then\n  sdl3_env\n  echo \"SDL3 source cache hit\"\n  exit 0\nfi\n# Submodule may predate the helper \u2014\
        \ inline HTTP/1.1 prefetch.\necho \"prefetch_sdl3.sh missing; using inline curl --http1.1\"\nmkdir -p .cache\nVER=3.4.10\n\
        SHA=12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785\nURL=\"https://github.com/libsdl-org/SDL/releases/download/release-${VER}/SDL3-${VER}.tar.gz\"\
        \nTAR=\".cache/SDL3-${VER}.tar.gz\"\ncurl -fsSL --http1.1 --retry 5 --retry-delay 2 -o \"${TAR}\" \"${URL}\"\necho\
        \ \"${SHA}  ${TAR}\" | sha256sum -c -\nrm -rf \"${OUT}.extracting\"\nmkdir -p \"${OUT}.extracting\"\n# --force-local:\
        \ belt-and-suspenders if a path ever gains a colon.\nif tar --help 2>&1 | grep -q -- '--force-local'; then\n  tar\
        \ --force-local -xzf \"${TAR}\" -C \"${OUT}.extracting\"\nelse\n  tar -xzf \"${TAR}\" -C \"${OUT}.extracting\"\nfi\n\
        INNER=\"$(find \"${OUT}.extracting\" -mindepth 1 -maxdepth 1 -type d | head -n1)\"\nrm -rf \"${OUT}\"\nmv \"${INNER}\"\
        \ \"${OUT}\"\nrm -rf \"${OUT}.extracting\"\nsdl3_env\n"
    - name: Fetch portable toolchain (Windows emitters)
      if: runner.os == 'Windows'
      uses: ./psxrecomp/.github/actions/fetch-toolchain
      with:
        artifact: ${{ matrix.artifact }}
    - name: Emitter cache key
      id: emitter_cache
      shell: bash
      run: |
        set -euo pipefail
        SHA="$(git -C psxrecomp rev-parse HEAD)"
        echo "key=emitters-v2-${{ matrix.os }}-${{ matrix.artifact }}-${{ matrix.deployment_target || 'native' }}-${SHA}-${{ hashFiles('.github/workflows/release.yml', '.release/*.py') }}" >>"$GITHUB_OUTPUT"
    - name: Cache emitters (build-recompiler)
      id: cache_emitters
      uses: actions/cache@v4
      with:
        path: build-recompiler
        key: ${{ steps.emitter_cache.outputs.key }}
    - name: Build recompiler tools (emitters)
      if: steps.cache_emitters.outputs.cache-hit != 'true'
      uses: ./psxrecomp/.github/actions/build-emitters
    - name: Verify emitters present
      shell: bash
      run: |
        set -euo pipefail
        # Restored cache or fresh build must leave packager inputs in place.
        test -d build-recompiler
        find build-recompiler -type f \( -name 'psxrecomp-game*' -o -name 'psxrecomp-bios*' \) | head
        count="$(find build-recompiler -type f \( -name 'psxrecomp-game*' -o -name 'psxrecomp-bios*' \) | wc -l | tr -d ' ')"
        if [[ "${count}" -lt 2 ]]; then
          echo "::error::expected psxrecomp-game + psxrecomp-bios under build-recompiler (found ${count})"
          exit 1
        fi
    - name: Setup ccache (Linux/macOS host build)
      if: runner.os != 'Windows'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: setup-host-${{ matrix.artifact }}
        max-size: 800M
    - name: Configure & build setup host
      env:
        CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}
      run: "set -euo pipefail\nEXTRA=()\nEXTRA+=(\"-DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON\")\nif [[ \"$(uname -s)\" == \"\
        Darwin\" ]]; then\n  # Force the pinned static SDL source even if Homebrew already contains SDL.\n  EXTRA+=(\"-DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON\"\
        \ \"-DSDL_SHARED=OFF\" \"-DSDL_STATIC=ON\")\nfi\nif [[ -n \"${CMAKE_OSX_DEPLOYMENT_TARGET:-}\" ]]; then\n  EXTRA+=(\"\
        -DCMAKE_OSX_DEPLOYMENT_TARGET=${CMAKE_OSX_DEPLOYMENT_TARGET}\")\nfi\nif [[ \"$(uname -s)\" != MINGW* && \"$(uname\
        \ -s)\" != MSYS* ]] && command -v ccache >/dev/null 2>&1; then\n  EXTRA+=(\"-DCMAKE_C_COMPILER_LAUNCHER=ccache\")\n\
        \  EXTRA+=(\"-DCMAKE_CXX_COMPILER_LAUNCHER=ccache\")\nfi\n# Point CMake at Vulkan headers/glslc. Prefer VULKAN_SDK\
        \ layout\n# (runtime.cmake checks $VULKAN_SDK first); also seed CMAKE_PREFIX_PATH\n# so find_path works after the\
        \ empty-_vk_inc fix in runtime.cmake.\nif [[ \"$(uname -s)\" == \"Darwin\" ]]; then\n  BREW_PREFIX=\"$(brew --prefix)\"\
        \n  export PATH=\"${BREW_PREFIX}/bin${PATH:+:${PATH}}\"\n  if command -v brew >/dev/null 2>&1; then\n    SHADERC_PREFIX=\"\
        $(brew --prefix shaderc 2>/dev/null || true)\"\n    VK_HDR_PREFIX=\"$(brew --prefix vulkan-headers 2>/dev/null ||\
        \ true)\"\n    if [[ -n \"${SHADERC_PREFIX}\" && -d \"${SHADERC_PREFIX}/bin\" ]]; then\n      export PATH=\"${SHADERC_PREFIX}/bin:${PATH}\"\
        \n    fi\n    for p in \"${VK_HDR_PREFIX}\" \"${SHADERC_PREFIX}\" \"${BREW_PREFIX}\"; do\n      if [[ -n \"${p}\"\
        \ && -d \"${p}\" ]]; then\n        export CMAKE_PREFIX_PATH=\"${p}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}\"\n\
        \      fi\n    done\n  else\n    export CMAKE_PREFIX_PATH=\"${BREW_PREFIX}${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}\"\
        \n  fi\n  if [[ -f \"${BREW_PREFIX}/include/vulkan/vulkan.h\" ]]; then\n    export VULKAN_SDK=\"${BREW_PREFIX}\"\n\
        \  elif [[ -n \"${VK_HDR_PREFIX:-}\" && -f \"${VK_HDR_PREFIX}/include/vulkan/vulkan.h\" ]]; then\n    export VULKAN_SDK=\"\
        ${VK_HDR_PREFIX}\"\n  fi\nelif [[ \"$(uname -s)\" == \"Linux\" ]]; then\n  if [[ -z \"${VULKAN_SDK:-}\" && -f /usr/include/vulkan/vulkan.h\
        \ ]]; then\n    export VULKAN_SDK=/usr\n  fi\nelif [[ \"$(uname -s)\" == MINGW* || \"$(uname -s)\" == MSYS* ]]; then\n\
        \  if [[ -z \"${VULKAN_SDK:-}\" && -f /mingw64/include/vulkan/vulkan.h ]]; then\n    export VULKAN_SDK=/mingw64\n\
        \  fi\nfi\nif command -v glslc >/dev/null 2>&1; then\n  EXTRA+=(\"-DGLSLC_EXE=$(command -v glslc)\")\nfi\nJOBS=\"\
        $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)\"\n# Emitters may have set PSXRECOMP_TOOLCHAIN_DIR\
        \ (llvm-mingw) via\n# GITHUB_ENV. Clear it before the MSYS2 g++ setup-host configure so\n# pack lib/ cannot win -L\
        \ for -static-libstdc++ (codecvt link errors).\nif [[ \"$(uname -s)\" == MINGW* || \"$(uname -s)\" == MSYS* ]]; then\n\
        \  unset PSXRECOMP_TOOLCHAIN_DIR TOOLCHAIN_DIR BPE_TOOLCHAIN_DIR RETCOMM_TOOLCHAIN_DIR || true\n  unset CMAKE_PREFIX_PATH\
        \ SDL3_DIR ZLIB_ROOT || true\nfi\n# Setup host: no game C, no BIOS backends linked. clear_generated.sh\n# already\
        \ wiped generated/; end users Generate OpenBIOS (+ optional\n# SCPH1001) locally via the wizard, then rebuild.\n#\
        \ Prefer -DPSXRECOMP_FORCE_SETUP_HOST=ON (psxrecomp_add_game_runtime).\n# Legacy -DYOURGAME_FORCE_SETUP_HOST=ON still\
        \ works if the title wires it.\n# PSX_SETUP_WIZARD is required with FORCE_SETUP_HOST (CMakeLists\n# ENABLE_SETUP_WIZARD\
        \ + -D here). Without it the zip never opens\n# first-run / Generate & rebuild.\n# Title root codegen_setup.c must\
        \ define\n# psx_game_codegen_forward_if_built (see codegen_setup.c.in) or link\n# fails \u2014 main.cpp always calls\
        \ it, including setup-host CI builds.\n# Netplay titles: set PSX_NETPLAY ON in CMakeLists *before*\n# include(runtime.cmake).\
        \ ENABLE_NETPLAY_IF_PRESENT alone is too late\n# (option() already cached OFF) and psx_netplay_sched.c still needs\n\
        # recomp_net/session.h. Also add -DPSX_NETPLAY=ON to this cmake\n# invocation for CI belt-and-suspenders (do not leave\
        \ it commented\n# mid-continuation \u2014 that breaks the shell line).\n# With PSX_NETPLAY, runtime.cmake defaults\
        \ RNET_ENABLE_ICE=ON.\n# recomp-net FetchContents libjuice via a pinned URL tarball (not\n# git clone) so AppImage\
        \ / mismatched libcurl hosts still configure.\n# Offline: vendor under psxrecomp/lib/recomp-net/third_party/libjuice\n\
        # or pass -DRNET_LIBJUICE_ROOT=\u2026 / -DRNET_ENABLE_ICE=OFF.\n# Add title-specific -D flags here if needed (e.g.\
        \ -DMOTK_NATIVE=OFF).\n# Netplay titles: also pass -DPSX_NETPLAY=ON here (belt-and-suspenders\n# when CMakeLists already\
        \ FORCE-caches it before include(runtime.cmake)).\n# Prefer pre-fetched SDL3 (see Prefetch SDL3 source) so configure\
        \ does\n# not call CMake file(DOWNLOAD) against GitHub release assets.\nif [[ -n \"${PSX_SDL3_SOURCE_DIR:-}\" && -f\
        \ \"${PSX_SDL3_SOURCE_DIR}/CMakeLists.txt\" ]]; then\n  EXTRA+=(\"-DFETCHCONTENT_SOURCE_DIR_SDL3=${PSX_SDL3_SOURCE_DIR}\"\
        )\nelif [[ -f \"${GITHUB_WORKSPACE}/.cache/sdl3-src/CMakeLists.txt\" ]]; then\n  EXTRA+=(\"-DFETCHCONTENT_SOURCE_DIR_SDL3=${GITHUB_WORKSPACE}/.cache/sdl3-src\"\
        )\nfi\ncmake -S . -B build-ci -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DPSXRECOMP_FORCE_SETUP_HOST=ON \\\n\
        \  -DPSXRECOMP_ALLOW_NO_BIOS=ON \\\n  -DPSX_SETUP_WIZARD=ON \\\n  -DPSX_GAME_VERSION=\"${RELEASE_VERSION}\" \\\n \
        \ \"${EXTRA[@]}\" 2>&1 | tee build-ci-configure.log\nif ! grep -q 'Vulkan backend: headers' build-ci-configure.log;\
        \ then\n  echo \"::error::CMake did not enable PSX_HAVE_VULKAN (see configure log)\"\n  exit 1\nfi\n# Ninja does not\
        \ emit flags.make (Makefiles generator only). Probe\n# whichever compile-flag artifact exists for PSX_HAVE_VULKAN.\n\
        FOUND_VK_DEFINE=0\nfor f in \\\n    build-ci/build.ninja \\\n    build-ci/compile_commands.json \\\n    build-ci/CMakeFiles/psx-runtime.dir/flags.make;\
        \ do\n  if [[ -f \"${f}\" ]] && grep -q 'PSX_HAVE_VULKAN' \"${f}\"; then\n    FOUND_VK_DEFINE=1\n    echo \"Found\
        \ PSX_HAVE_VULKAN in ${f}\"\n    break\n  fi\ndone\nif [[ \"${FOUND_VK_DEFINE}\" -ne 1 ]]; then\n  echo \"::error::PSX_HAVE_VULKAN\
        \ missing from psx-runtime compile flags\"\n  exit 1\nfi\ncmake --build build-ci --target psx-runtime -j\"${JOBS}\"\
        \n# Lobby list pin must match RELEASE_VERSION (package_setup_host enforces).\nSTAMP=\"\"\nfor cand in \\\n    build-ci/psx_game_version.txt\
        \ \\\n    build-ci/Release/psx_game_version.txt \\\n    build-ci/*/psx_game_version.txt\ndo\n  if [[ -f \"${cand}\"\
        \ ]]; then STAMP=\"${cand}\"; break; fi\ndone\nif [[ -z \"${STAMP}\" ]]; then\n  # Fallback: stamp next to the host\
        \ exe\n  STAMP=\"$(find build-ci -name psx_game_version.txt -type f 2>/dev/null | head -n1 || true)\"\nfi\nif [[ -z\
        \ \"${STAMP}\" || ! -f \"${STAMP}\" ]]; then\n  echo \"::error::missing psx_game_version.txt after build (update psxrecomp\
        \ submodule)\"\n  exit 1\nfi\nBUILT=\"$(tr -d '[:space:]' <\"${STAMP}\")\"\nBUILT=\"${BUILT#v}\"\nif [[ \"${BUILT}\"\
        \ != \"${RELEASE_VERSION}\" ]]; then\n  echo \"::error::lobby pin stamp ${BUILT} != RELEASE_VERSION ${RELEASE_VERSION}\
        \ (${STAMP})\"\n  exit 1\nfi\necho \"lobby pin ok: ${BUILT} (${STAMP})\"\n"
    - name: Sign macOS setup executables
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        from pathlib import Path
        import subprocess
        import sys
        sys.path.insert(0, '.release/')
        from release_package_gate import source_contract
        name = source_contract('.', os.environ['RELEASE_VERSION'])['exe_name']
        hosts = [p for p in Path('build-ci').rglob(name) if p.is_file()]
        if len(hosts) != 1:
            raise SystemExit('Expected one compiled setup host for signing')
        binaries = hosts + [Path('build-recompiler') / name for name in ('psxrecomp-game', 'psxrecomp-bios')]
        for binary in binaries:
            subprocess.run(['codesign', '--force', '--sign', '-', '--timestamp=none', str(binary)], check=True)
            subprocess.run(['codesign', '--verify', '--strict', str(binary)], check=True)
        PY
    - name: Package setup zip
      env:
        WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      run: |
        set -euo pipefail
        chmod +x scripts/package_setup_release.sh
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          export PSXRECOMP_RUNTIME_BIN_DIR=/mingw64/bin
          export BPE_RUNTIME_BIN_DIR=/mingw64/bin
        fi
        export RELEASE_VERSION
        # Lean zip (no embedded toolchain/). Retro / wizard download
        # cmake-clang-v1; pass --embed-toolchain only for offline-first packs.
        scripts/package_setup_release.sh build-ci "${{ matrix.artifact }}" build-recompiler
        ls -la dist/
    - name: Verify zip ships the mod catalog
      shell: bash
      run: |
        set -euo pipefail
        # Gate the release on the catalog actually being inside the zip.
        # The packager stages mods/ by default, but this shipped broken for
        # a long time precisely because nothing checked: the Mods page was
        # empty in every release and the build logs looked fine. Assert the
        # artifact, not the intent.
        ZIP=$(ls dist/syphon-filter-2-recomp-*-"${{ matrix.artifact }}".zip | head -1)
        echo "checking ${ZIP}"
        MANIFESTS=$(unzip -l "${ZIP}" | grep -c 'mods/bundled/.*/manifest\.toml' || true)
        echo "mod manifests in zip: ${MANIFESTS}"
        if [[ "${MANIFESTS}" -lt 1 ]]; then
          echo "::error::release zip ships no mod catalog (mods/bundled/*/manifest.toml)" >&2
          unzip -l "${ZIP}" | head -40 >&2
          exit 1
        fi
        # Per-machine mod state must never ship: preloaded catalogs are
        # default-disabled, so a leaked state.toml makes one machine's
        # selections everybody's defaults.
        if unzip -l "${ZIP}" | grep -q 'state\.toml'; then
          echo "::error::release zip contains mods/state.toml (per-machine state)" >&2
          exit 1
        fi
        # Same rule, other half: mods/installed/ is the launcher-owned tree of
        # .psxmod archives a developer installed as a player would. Only
        # mods/bundled/ is build output, and only build output ships.
        if unzip -l "${ZIP}" | grep -q 'mods/installed/'; then
          echo "::error::release zip contains mods/installed (per-machine installs)" >&2
          exit 1
        fi
        # Developer-channel packages are unfinished work that ships with
        # local builds only. The packager drops them under CI automatically
        # (it keys off $CI); assert the outcome so a future change to that
        # default cannot quietly publish in-progress mods.
        if unzip -p "${ZIP}" 'mods/**/manifest.toml' 2>/dev/null \
             | grep -Eq '^[[:space:]]*channel[[:space:]]*=[[:space:]]*"developer"'; then
          echo "::error::release zip contains developer-channel mod packages" >&2
          exit 1
        fi
        echo "mod catalog verified in ${ZIP} (no developer-channel packages)"
    - name: Audit exact archive and run native generators
      shell: bash
      run: |
        set -euo pipefail
        if command -v python3 >/dev/null 2>&1; then PYTHON=python3; else PYTHON=python; fi
        shopt -s nullglob
        ZIPS=(dist/*-"${{ matrix.artifact }}".zip)
        [[ ${#ZIPS[@]} -eq 1 ]] || { echo "Expected exactly one platform ZIP" >&2; exit 1; }
        "${PYTHON}" .release/audit_setup_package_platform_copy.py "${ZIPS[0]}"
        "${PYTHON}" .release/release_package_gate.py --source . --version "${RELEASE_VERSION}" --zip "${ZIPS[0]}" --platform "${{ matrix.artifact }}" --native --output "dist/${{ matrix.artifact }}-gate.json"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: syphon-filter-2-recomp-${{ matrix.artifact }}
        path: |-
          dist/syphon-filter-2-recomp-*-${{ matrix.artifact }}.zip
          dist/${{ matrix.artifact }}-gate.json
        if-no-files-found: error
        retention-days: '30'
    - name: Upload diagnostic logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: diagnostics-${{ matrix.artifact }}
        path: |-
          build-ci-configure.log
          dist/*-gate.json
        if-no-files-found: ignore
    container: ${{ matrix.container || '' }}
    permissions:
      contents: read
    timeout-minutes: 90
