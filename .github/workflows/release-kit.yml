name: Release kit

# This workflow builds developer tools and packages an owned-input setup kit.
# It never acquires an SF2 disc/EXE, generates SF2 C, or builds a game binary.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  PSXRECOMP_REF: 5d9b20ef968a15f9b30bc1d400bd43818dd058d5

jobs:
  build-kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Alexbeav/psxrecomp
          ref: ${{ env.PSXRECOMP_REF }}
          path: psxrecomp-framework
          submodules: recursive
      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Audit public source
        run: |
          python tools/public_repo_audit.py --root .
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build pinned PSXRecomp CLI
        shell: msys2 {0}
        run: cd psxrecomp-framework && python tools/build_cli.py release
      - name: Smoke-test packaged CLI layout
        shell: msys2 {0}
        run: |
          psxrecomp-framework/dist/psxrecomp-cli-*/psxrecomp.exe --help
          psxrecomp-framework/dist/psxrecomp-cli-*/libexec/psxrecomp-game.exe --help
          psxrecomp-framework/dist/psxrecomp-cli-*/libexec/psxrecomp-bios.exe --help
      - name: Assemble owned-input player kit
        shell: pwsh
        run: |
          $cli = Get-ChildItem psxrecomp-framework/dist -Directory -Filter 'psxrecomp-cli-*' | Select-Object -First 1
          .\tools\package_kit.ps1 `
            -CliDir $cli.FullName `
            -FrameworkRoot psxrecomp-framework
      - uses: actions/upload-artifact@v6
        with:
          name: syphon-filter-2-recompiled-kit-windows-x64
          path: dist/syphon-filter-2-recompiled-kit-windows-x64.zip
          if-no-files-found: error

  publish-release-assets:
    if: github.event_name == 'release'
    needs: build-kit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: syphon-filter-2-recompiled-kit-windows-x64
      - name: Attach owned-input kit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          syphon-filter-2-recompiled-kit-windows-x64.zip
          --repo "$GITHUB_REPOSITORY" --clobber
