name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PSXRECOMP_REF: 35b45d716eafd68964c05d0b278e8c6c158f6786

jobs:
  public-source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit repository contents
        run: python tools/public_repo_audit.py --root .
      - name: Exercise release-audit rejection paths
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  framework-cli-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned PSXRecomp framework
        uses: actions/checkout@v6
        with:
          repository: Alexbeav/psxrecomp
          ref: ${{ env.PSXRECOMP_REF }}
          path: psxrecomp-framework
          submodules: recursive
      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          # UCRT64 matches every real build of this game (WinLibs UCRT kit,
          # RetComM llvm-mingw UCRT) and the framework's own tasreplays CI;
          # MINGW64's msvcrt lacks C11 fopen "x" mode. git is required by the
          # framework's TAS tooling tests.
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Build pinned PSXRecomp CLI
        shell: msys2 {0}
        run: cd psxrecomp-framework && python tools/build_cli.py release
      - name: Build registered framework tests
        shell: msys2 {0}
        run: cmake --build psxrecomp-framework/recompiler/build-cli --parallel
      - name: Run registered framework tests
        shell: msys2 {0}
        run: ctest --test-dir psxrecomp-framework/recompiler/build-cli --output-on-failure
      - name: Confirm no retail code was generated
        shell: pwsh
        run: |
          if (Test-Path generated) { throw "CI must not generate SF2 code" }
          if (Test-Path input) { throw "CI must not acquire retail SF2 inputs" }
